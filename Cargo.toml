[package]
name = "quicklendx-contracts"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
legacy-tests = [] # 🚀 FIX: This explicitly tells Cargo that "legacy-tests" is a valid target flag for CI

[dependencies]
soroban-sdk = { version = "20.5.0" }

[dev-dependencies]
soroban-sdk = { version = "20.5.0", features = ["testutils"] }

[profile.dev]
panic = "unwind"      # Fixes Windows stack buffer overrun crash by enabling test unwinding

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true